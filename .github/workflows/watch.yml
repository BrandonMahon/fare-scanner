name: Fare watch

on:
  schedule:
    - cron: "23 * * * *"   # hourly; GitHub may delay individual firings
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fare-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        # typing_extensions: fast-flights 3.0.2 imports it but omits it from its deps
        run: pip install fast-flights typing_extensions

      - name: Run watch
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watch.py

      - name: Commit state
        run: |
          git config user.name "fare-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull --rebase || true
          git add docs/data/watch_state.json
          git diff --cached --quiet || git commit -m "Watch state $(date -u +%FT%H:%MZ)"
          git push || (git pull --rebase && git push)
